<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Unit 12 Project</title>

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        img {
            margin: 10px;
            width: 200px;
        }

        button {
            margin: 10px;
            padding: 5px 10px;
        }

        button:hover {
            background-color: lightpink;
        }
    </style>
</head>

<body>

<h1>Quiz About Brieee</h1>
<hr>

<! MOVIE QUESTION >
<form id="movie-form">
    <label>What is my favorite movie?</label>
    <select id="movie-answer">
        <option value="m1">Dazed and Confused</option>
        <option value="m2">The Batman</option>
        <option value="m3">Blink Twice</option>
        <option value="m4">Waves (2019)</option>
        <option value="m5">500 Days of Summer</option>
    </select>
    <button type="submit">Check Movie Answer</button>
</form>

<div id="movie-result">
    <p id="movie-text"></p>

    <img id="m1-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRizbkYsJSym80YlvhDdu487Iid132C88UWPw&s"
    width="200">
    <img id="m2-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGKi7Zw7q-2ubueq-rKp5_MngniU5Ibb_Erw&s"
    width="200">
    <img id="m3-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToinmpQXEgedqrQktNIZDC2Hl7-hawE9VViQ&s"
    width="200">
    <img id="m4-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWJF5E_-fUZvuIEkDJ8Qy5cAn4DypSFe6Pxw&s"
    width="200">
    <img id="m5-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQb5yhlu3TIpDaPHyGFl1EAlx22ZSP3_vBitQ&s"
    width="200">
</div>

<hr>

<!-- BOOK QUESTION -->
<form id="book-form">
    <label>What is my favorite book?</label>
    <select id="book-answer">
        <option value="b1">The Sun Is Also a Star</option>
        <option value="b2">Bash and Audre Are Just Friends</option>
        <option value="b3">The Poet X</option>
        <option value="b4">Mickey7</option>
    </select>
    <button type="submit">Check Book Answer</button>
</form>

<div id="book-result">
    <p id="book-text"></p>

    <img id="b1-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWi00u6f4QihQxc_j4FyD0rmZBg9R_pQQLJQ&s"
    width="200">
    <img id="b2-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBrF1CZCNhgN3LhjF27dF014WmKgDdxQZBUA&s"
    width="200">
    <img id="b3-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTaCzfG4uEVzQFAXd__LP6xoZ7Lrjzj7KFULg&s"
    width="200">
    <img id="b4-img" src="https://m.media-amazon.com/images/I/81WDoZkIWgL._AC_UF1000,1000_QL80_.jpg"
    width="200">
</div>

<hr>



<script>

// hide all images at start
$("img").hide();


// MOVIE QUESTION
$("#movie-form").on("submit", function(event) {
    event.preventDefault();

    var answer = $("#movie-answer").val();

    $("#movie-result img").hide();
    $("#" + answer + "-img").fadeIn();

    if (answer === "m4-img") {
        $("#movie-text").text("YESSSS!");
    } else {
        $("#movie-text").text("Try Again!");
    }

    $("#movie-result").fadeToggle();
});


// BOOK QUESTION
$("#book-form").on("submit", function(event) {
    event.preventDefault();

    var answer = $("#book-answer").val();

    $("#book-result img").hide();
    $("#" + answer + "-img").slideDown();

    if (answer === "b2") {
        $("#book-text").text("YESSSS!");
    } else {
        $("#book-text").text("Try Again!");
    }

    $("#" + answer + "-img").animate({
        width: "300px"
    });
});


// HOVER FEATURE
$("#extra-img").hover(
    function() {
        $(this).animate({opacity: 0.5});
    },
    function() {
        $(this).animate({opacity: 1});
    }
);

</script>

</body>
</html>




  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
